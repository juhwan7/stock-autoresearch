name: Supervisor 결과 적용 및 Telegram

on:
  push:
    branches: [main]
    paths:
      - "data/supervisor/ai-results/*.json"

permissions:
  contents: write
  issues: write

concurrency:
  group: supervisor-result-apply
  cancel-in-progress: false

jobs:
  apply-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Find newest AI result
        id: result
        shell: bash
        run: |
          RESULT="$(ls -1t data/supervisor/ai-results/*.json | head -1)"
          echo "path=$RESULT" >> "$GITHUB_OUTPUT"
      - name: Apply result to canonical state
        run: python scripts/감독결과_적용.py "${{ steps.result.outputs.path }}"
      - name: Validate
        run: |
          python -m py_compile scripts/감독결과_적용.py scripts/감독결과_알림.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("data/supervisor/latest-report.json").read_text())
          s=json.loads(Path("data/supervisor/state.json").read_text())
          assert r["batch_id"] == s["last_batch_id"]
          assert r["processed_at"] == s["last_processed_at"]
          assert r["notify"] is True
          print("canonical supervisor state verified")
          PY
      - name: Commit canonical state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/supervisor/latest-report.json data/supervisor/state.json
          if git diff --cached --quiet; then
            echo "No canonical changes"
          else
            git commit -m "supervisor: apply AI result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Send Telegram result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/감독결과_알림.py
