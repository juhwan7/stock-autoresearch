name: Supervisor 결과 적용 및 Telegram

on:
  workflow_dispatch:
    inputs:
      supervisor_result:
        description: "Supervisor A/B 결과 JSON. 직접 main 쓰기가 막힐 때 Action 단일 writer가 저장·적용합니다."
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "data/supervisor/ai-results/*.json"
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: supervisor-result-apply
  cancel-in-progress: false

jobs:
  apply-and-notify:
    if: github.event_name != 'issues' || (startsWith(github.event.issue.title, '[Supervisor Result]') && github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"

      - name: Receive or find Supervisor result
        id: result
        shell: bash
        env:
          DISPATCH_RESULT: ${{ inputs.supervisor_result }}
          ISSUE_RESULT: ${{ github.event.issue.body }}
        run: |
          RESULT="$(python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path("data/supervisor/ai-results")
          root.mkdir(parents=True, exist_ok=True)
          raw = (os.environ.get("DISPATCH_RESULT") or os.environ.get("ISSUE_RESULT") or "").strip()

          if raw:
              try:
                  payload = json.loads(raw)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"invalid supervisor_result JSON: {exc}")
              if not isinstance(payload, dict):
                  raise SystemExit("supervisor_result must be a JSON object")

              required = ("batch_id", "processed_at", "supervisor", "notify", "summary", "feedback_to_other_supervisor")
              missing = [key for key in required if key not in payload]
              if missing:
                  raise SystemExit("missing required fields: " + ", ".join(missing))
              batch_id = str(payload.get("batch_id") or "").strip()
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+:-]{5,159}", batch_id):
                  raise SystemExit("unsafe or invalid batch_id")
              supervisor = str(payload.get("supervisor") or "").strip().upper()
              if supervisor not in {"A", "B"}:
                  raise SystemExit("supervisor must be A or B")
              if payload.get("notify") is not True:
                  raise SystemExit("notify must be true")
              if not payload.get("feedback_to_other_supervisor"):
                  raise SystemExit("feedback_to_other_supervisor must not be empty")

              path = root / f"{batch_id}.json"
              serialized = json.dumps(payload, ensure_ascii=False, indent=2) + "\n"
              if path.exists():
                  existing = json.loads(path.read_text(encoding="utf-8"))
                  if existing != payload:
                      raise SystemExit(f"batch_id already exists with different content: {batch_id}")
              else:
                  path.write_text(serialized, encoding="utf-8")
              print(path)
          else:
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              changed = []
              for commit in event.get("commits", []):
                  changed.extend(commit.get("added", []))
                  changed.extend(commit.get("modified", []))
              candidates = [
                  Path(p) for p in changed
                  if p.startswith("data/supervisor/ai-results/")
                  and p.endswith(".json")
                  and Path(p).exists()
              ]
              if not candidates:
                  raise SystemExit("no Supervisor AI result found in push")
              def processed_at(path):
                  try:
                      return json.loads(path.read_text(encoding="utf-8")).get("processed_at", "")
                  except Exception:
                      return ""
              print(max(candidates, key=processed_at))
          PY
          )"
          echo "path=$RESULT" >> "$GITHUB_OUTPUT"
          echo "Supervisor result: $RESULT"

      - name: Apply result to canonical state
        run: python scripts/감독결과_적용.py "${{ steps.result.outputs.path }}"

      - name: Refresh long-term AI memory
        id: long_memory
        continue-on-error: true
        run: python scripts/장기기억_갱신.py

      - name: Archive issue lifecycle
        run: python scripts/이슈원장_아카이브.py "${{ steps.result.outputs.path }}"

      - name: Validate
        run: |
          python -m py_compile scripts/감독결과_적용.py scripts/감독결과_알림.py scripts/장기기억_갱신.py
          python - <<'PY'
          import json
          from pathlib import Path
          result_path = Path("${{ steps.result.outputs.path }}")
          source = json.loads(result_path.read_text(encoding="utf-8"))
          r=json.loads(Path("data/supervisor/latest-report.json").read_text())
          s=json.loads(Path("data/supervisor/state.json").read_text())
          assert source["batch_id"] == r["batch_id"] == s["last_batch_id"]
          assert r["processed_at"] == s["last_processed_at"]
          assert r["notify"] is True
          assert result_path.name == f'{source["batch_id"]}.json'
          print("Supervisor result and canonical state verified")
          PY

      - name: Commit result and canonical state as one writer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.result.outputs.path }}"
          git add data/supervisor/latest-report.json data/supervisor/state.json data/supervisor/market-issues.json data/market/recent-sessions.json data/research/popular-reports.json data/news/issue-digest.json
          if [ -f data/supervisor/disagreements.json ]; then git add data/supervisor/disagreements.json; fi
          if [ -d data/news/archive ]; then git add data/news/archive; fi
          if [ -d memory ]; then git add memory; fi
          if git diff --cached --quiet; then
            echo "No Supervisor result/canonical changes"
          else
            git commit -m "Supervisor 결과 반영: 단일 writer 저장·canonical 갱신"
            for ATTEMPT in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "Supervisor result/canonical 저장 성공"
                break
              fi
              git rebase --abort || true
              if [ "$ATTEMPT" -eq 3 ]; then
                echo "Supervisor result/canonical 저장에 3회 실패했습니다." >&2
                exit 1
              fi
              sleep $((ATTEMPT * 2))
            done
          fi

      - name: Verify persisted result on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          RESULT_PATH="${{ steps.result.outputs.path }}"
          LOCAL_BATCH="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["batch_id"])' "$RESULT_PATH")"
          gh api "repos/$GH_REPO/contents/$RESULT_PATH?ref=main" --jq '.content' | tr -d '\n' | base64 -d > /tmp/persisted-result.json
          REMOTE_BATCH="$(python -c 'import json; print(json.load(open("/tmp/persisted-result.json", encoding="utf-8"))["batch_id"])')"
          test "$LOCAL_BATCH" = "$REMOTE_BATCH"
          echo "main result persistence verified: $REMOTE_BATCH"

      - name: Close consumed dispatch issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "Supervisor 결과가 단일 writer 경로로 저장·적용되었습니다."
          gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO"

      - name: Send Telegram result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/감독결과_알림.py
