name: Supervisor 결과 적용 및 Telegram

on:
  push:
    branches: [main]
    paths:
      - "data/supervisor/ai-results/*.json"

permissions:
  contents: write
  issues: write

concurrency:
  group: supervisor-result-apply
  cancel-in-progress: false

jobs:
  apply-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Find pushed AI result
        id: result
        shell: bash
        run: |
          RESULT="$(python - <<'PY'
          import json, os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          changed = []
          for commit in event.get("commits", []):
              changed.extend(commit.get("added", []))
              changed.extend(commit.get("modified", []))
          candidates = [
              Path(p) for p in changed
              if p.startswith("data/supervisor/ai-results/") and p.endswith(".json") and Path(p).exists()
          ]
          if not candidates:
              candidates = list(Path("data/supervisor/ai-results").glob("*.json"))
          if not candidates:
              raise SystemExit("no Supervisor AI result found")

          def processed_at(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8")).get("processed_at", "")
              except Exception:
                  return ""
          print(max(candidates, key=processed_at))
          PY
          )"
          echo "path=$RESULT" >> "$GITHUB_OUTPUT"
      - name: Apply result to canonical state
        run: python scripts/감독결과_적용.py "${{ steps.result.outputs.path }}"
      - name: Validate
        run: |
          python -m py_compile scripts/감독결과_적용.py scripts/감독결과_알림.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("data/supervisor/latest-report.json").read_text())
          s=json.loads(Path("data/supervisor/state.json").read_text())
          assert r["batch_id"] == s["last_batch_id"]
          assert r["processed_at"] == s["last_processed_at"]
          assert r["notify"] is True
          print("canonical supervisor state verified")
          PY
      - name: Commit canonical state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/supervisor/latest-report.json data/supervisor/state.json data/supervisor/market-issues.json
          if git diff --cached --quiet; then
            echo "No canonical changes"
          else
            git commit -m "Supervisor 결과 반영: canonical 상태·이슈 타임라인 갱신"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Send Telegram result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/감독결과_알림.py
