name: GitHub Pages 즉시 배포

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "reports/**"
      - "data/supervisor/latest-report.json"
      - "data/discovery/**"
      - "data/news/**"
      - "data/research/**"
      - "data/market/**"
      - "data/risk/**"
      - "data/health/**"
      - "data/regression/**"
      - "data/providers/toss/**"
      - "data/providers/naver_batch/**"
      - "docs/사용자_도움_필요.md"
      - "docs/AI_변경기록.md"
      - "docs/결정_원장.md"
      - "docs/아이디어_보드.md"
      - "scripts/대시보드_생성.py"
      - ".github/workflows/페이지배포.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 최신 대시보드 데이터 생성
        run: python scripts/대시보드_생성.py

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5

      - name: 사이트 업로드
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
