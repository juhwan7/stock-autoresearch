name: 고정 IP 토스 10분 시장 데이터

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: stock-autoresearch-fixed-ip-toss
  cancel-in-progress: false

jobs:
  fixed-ip-market:
    if: github.event_name == 'workflow_dispatch' || vars.TOSS_FIXED_IP_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, linux, stock-autoresearch-fixed-ip]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Collect Toss Top50 and recent 1-minute candles
        id: toss_batch
        env:
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
        run: python -m autoresearch toss-batch-market --limit 50

      - name: Summarize Toss provider state
        run: python scripts/토스상태_요약.py

      - name: Validate Toss batch code
        run: |
          python -m compileall -q src
          pytest -q tests/test_toss_collector.py tests/test_toss_batch_market.py
          git diff --check

      - name: Commit Toss market state
        run: |
          git config user.name "stock-autoresearch[toss-fixed-ip]"
          git config user.email "stock-autoresearch[bot]@users.noreply.github.com"
          git add data/providers/toss
          if git diff --cached --quiet; then
            echo "저장할 Toss 시장 변화가 없습니다."
          else
            git commit -m "observe: record Toss 10-minute market batch"
            git pull --rebase
            git push
          fi
