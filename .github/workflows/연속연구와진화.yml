name: 6분 감독 관측 큐
# workflow-change push is a smoke-test trigger only; scheduled runs remain canonical.
# Freshness-filter smoke run: 2026-09-25.
# Safe self-heal smoke run: Naver/Google/Market/Risk/Regression.
# Rolling Top50 smoke run.
# Ignore stale holiday/preopen ranking smoke run.
# Stale holiday carryover smoke run.
# Toss Pi relay integration smoke run.
# Relative-strength KOSPI JSON source smoke run.
# Three-session historical fallback smoke run.
# Relative-strength live KOSPI prevChangeRate parser smoke run.
# Multi-period relative-strength Yahoo batch smoke run.
# KOFIA big-money parser verification smoke run.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/연속연구와진화.yml"
  schedule:
    - cron: "*/6 * * * *"

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: stock-autoresearch-observer
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Fetch Toss provider snapshot
        id: fetch_toss
        continue-on-error: true
        env:
          TOSS_SNAPSHOT_URL: https://raw.githubusercontent.com/juhwan7/vibe-coding-playground/stock-autoresearch-toss-data/latest.json
        run: python scripts/토스스냅샷_가져오기.py

      - name: Summarize Toss provider state
        id: toss_summary
        continue-on-error: true
        run: |
          if [ -f data/providers/toss/latest.json ]; then
            python scripts/토스상태_요약.py
          fi

      - name: Collect public six-minute market batch
        id: public_batch
        continue-on-error: true
        run: python -m autoresearch naver-batch-market --limit 100

      - name: Collect index-relative strength
        id: relative_strength
        continue-on-error: true
        run: python -m autoresearch relative-strength --limit 500

      - name: Collect broad market discovery
        id: discovery
        continue-on-error: true
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m autoresearch market-discovery-observe

      - name: Repair market runtime without AI
        id: market_sensor
        continue-on-error: true
        env:
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_SECRET_KEY: ${{ secrets.KIWOOM_SECRET_KEY }}
        run: python -m autoresearch market-intel --mode sensor

      - name: Repair risk and macro runtime without AI
        id: risk_sensor
        continue-on-error: true
        run: python -m autoresearch risk-intel --mode sensor

      - name: Refresh regression guard
        id: regression
        continue-on-error: true
        run: python -m autoresearch regression

      - name: Health watchdog after repair attempts
        id: health
        continue-on-error: true
        run: python -m autoresearch health

      - name: Collect official big-money market data
        id: big_money
        continue-on-error: true
        run: python scripts/거대자금_수집.py

      - name: Build dashboard data
        id: dashboard
        continue-on-error: true
        run: python scripts/대시보드_생성.py

      - name: Validate repository
        run: |
          set +e

          COMPILE_STATUS=ok
          python -m compileall -q src collector scripts || COMPILE_STATUS=failed

          PYTEST_STATUS=ok
          pytest -q || PYTEST_STATUS=failed

          DIFF_STATUS=ok
          git diff --check || DIFF_STATUS=failed

          VALIDATION_STATUS=ok
          if [ "$COMPILE_STATUS" != "ok" ] || [ "$PYTEST_STATUS" != "ok" ] || [ "$DIFF_STATUS" != "ok" ]; then
            VALIDATION_STATUS=failed
          fi

          echo "COMPILE_STATUS=$COMPILE_STATUS" >> "$GITHUB_ENV"
          echo "PYTEST_STATUS=$PYTEST_STATUS" >> "$GITHUB_ENV"
          echo "DIFF_STATUS=$DIFF_STATUS" >> "$GITHUB_ENV"
          echo "VALIDATION_STATUS=$VALIDATION_STATUS" >> "$GITHUB_ENV"

          echo "compile=$COMPILE_STATUS pytest=$PYTEST_STATUS diff=$DIFF_STATUS validation=$VALIDATION_STATUS"

      - name: Record 6-minute supervisor observation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOSS_FETCH_STATUS: ${{ steps.fetch_toss.outcome }}
          TOSS_SUMMARY_STATUS: ${{ steps.toss_summary.outcome }}
          HEALTH_STEP_STATUS: ${{ steps.health.outcome }}
          DASHBOARD_STEP_STATUS: ${{ steps.dashboard.outcome }}
          DISCOVERY_STEP_STATUS: ${{ steps.discovery.outcome }}
          PUBLIC_BATCH_STATUS: ${{ steps.public_batch.outcome }}
          MARKET_SENSOR_STATUS: ${{ steps.market_sensor.outcome }}
          RISK_SENSOR_STATUS: ${{ steps.risk_sensor.outcome }}
          REGRESSION_STEP_STATUS: ${{ steps.regression.outcome }}
        run: python -m autoresearch supervisor-observe

      - name: Commit observation data
        run: |
          git config user.name "stock-autoresearch[bot]"
          git config user.email "stock-autoresearch[bot]@users.noreply.github.com"

          git add data/supervisor
          if [ -d data/providers/toss ]; then git add data/providers/toss; fi
          if [ -d data/providers/naver_batch ]; then git add data/providers/naver_batch; fi
          if [ -d data/health ]; then git add data/health; fi
          if [ -d data/discovery ]; then git add data/discovery; fi
          if [ -d data/market ]; then git add data/market; fi
          if [ -d data/risk ]; then git add data/risk; fi
          if [ -d data/macro ]; then git add data/macro; fi
          if [ -d data/regression ]; then git add data/regression; fi
          if [ -d site ]; then git add site; fi

          if git diff --cached --quiet; then
            echo "이번 6분 관측에는 저장할 변화가 없습니다."
          else
            git commit -m "observe: record 6-minute supervisor checkpoint"

            # 다른 AI/사용자 작업이 같은 시각 main을 갱신하면 생성 데이터는
            # 줄 단위 병합보다 다음 6분 주기에 최신 입력으로 다시 만드는 편이 안전하다.
            # 오래된 관측을 억지로 재베이스해 충돌 파일을 저장하지 않는다.
            if ! git pull --rebase; then
              echo "main 동시 갱신으로 관측 데이터가 충돌했습니다. 오래된 관측 커밋을 폐기하고 다음 주기에 재수집합니다."
              git rebase --abort || true
              exit 0
            fi

            if ! git push; then
              echo "push 직전 main이 다시 갱신되었습니다. 이번 관측은 저장하지 않고 다음 주기에 최신 상태로 재수집합니다."
              exit 0
            fi
          fi

      - name: Surface validation failure
        if: env.VALIDATION_STATUS != 'ok'
        run: |
          echo "저장소 검증 실패가 감독 큐에 기록되었습니다."
          exit 1
