name: 6분 감독 관측 큐
# workflow-change push is a smoke-test trigger only; scheduled runs remain canonical.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/연속연구와진화.yml"
  schedule:
    - cron: "*/6 * * * *"

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: stock-autoresearch-observer
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Fetch Toss provider snapshot
        id: fetch_toss
        continue-on-error: true
        if: vars.TOSS_FIXED_IP_RUNNER_ENABLED != 'true'
        env:
          TOSS_SNAPSHOT_URL: ${{ secrets.TOSS_SNAPSHOT_URL }}
          TOSS_SNAPSHOT_TOKEN: ${{ secrets.TOSS_SNAPSHOT_TOKEN }}
        run: python scripts/토스스냅샷_가져오기.py

      - name: Summarize Toss provider state
        id: toss_summary
        continue-on-error: true
        if: vars.TOSS_FIXED_IP_RUNNER_ENABLED != 'true'
        run: |
          if [ -f data/providers/toss/latest.json ]; then
            python scripts/토스상태_요약.py
          fi

      - name: Collect broad market discovery
        id: discovery
        continue-on-error: true
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m autoresearch market-discovery-observe

      - name: Health watchdog
        id: health
        continue-on-error: true
        run: python -m autoresearch health

      - name: Build dashboard data
        id: dashboard
        continue-on-error: true
        run: python scripts/대시보드_생성.py

      - name: Validate repository
        run: |
          set +e

          COMPILE_STATUS=ok
          python -m compileall -q src collector scripts || COMPILE_STATUS=failed

          PYTEST_STATUS=ok
          pytest -q || PYTEST_STATUS=failed

          DIFF_STATUS=ok
          git diff --check || DIFF_STATUS=failed

          VALIDATION_STATUS=ok
          if [ "$COMPILE_STATUS" != "ok" ] || [ "$PYTEST_STATUS" != "ok" ] || [ "$DIFF_STATUS" != "ok" ]; then
            VALIDATION_STATUS=failed
          fi

          echo "COMPILE_STATUS=$COMPILE_STATUS" >> "$GITHUB_ENV"
          echo "PYTEST_STATUS=$PYTEST_STATUS" >> "$GITHUB_ENV"
          echo "DIFF_STATUS=$DIFF_STATUS" >> "$GITHUB_ENV"
          echo "VALIDATION_STATUS=$VALIDATION_STATUS" >> "$GITHUB_ENV"

          echo "compile=$COMPILE_STATUS pytest=$PYTEST_STATUS diff=$DIFF_STATUS validation=$VALIDATION_STATUS"

      - name: Record 6-minute supervisor observation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOSS_FETCH_STATUS: ${{ steps.fetch_toss.outcome }}
          TOSS_SUMMARY_STATUS: ${{ steps.toss_summary.outcome }}
          HEALTH_STEP_STATUS: ${{ steps.health.outcome }}
          DASHBOARD_STEP_STATUS: ${{ steps.dashboard.outcome }}
          DISCOVERY_STEP_STATUS: ${{ steps.discovery.outcome }}
        run: python -m autoresearch supervisor-observe

      - name: Notify latest hourly supervisor result
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/감독결과_알림.py

      - name: Commit observation data
        run: |
          git config user.name "stock-autoresearch[bot]"
          git config user.email "stock-autoresearch[bot]@users.noreply.github.com"

          git add data/supervisor
          if [ -d data/providers/toss ]; then git add data/providers/toss; fi
          if [ -d data/health ]; then git add data/health; fi
          if [ -d data/discovery ]; then git add data/discovery; fi
          if [ -d site ]; then git add site; fi

          if git diff --cached --quiet; then
            echo "이번 6분 관측에는 저장할 변화가 없습니다."
          else
            git commit -m "observe: record 6-minute supervisor checkpoint"
            git pull --rebase
            git push
          fi

      - name: Surface validation failure
        if: env.VALIDATION_STATUS != 'ok'
        run: |
          echo "저장소 검증 실패가 감독 큐에 기록되었습니다."
          exit 1
