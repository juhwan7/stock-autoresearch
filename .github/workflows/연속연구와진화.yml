name: 10분 감독 관측 큐
# workflow-change push is a smoke-test trigger only; scheduled runs remain canonical.
# Freshness-filter smoke run: 2026-09-25.
# Safe self-heal smoke run: Naver/Google/Market/Risk/Regression.
# Rolling Top50 smoke run.
# Ignore stale holiday/preopen ranking smoke run.
# Stale holiday carryover smoke run.
# Toss Pi relay integration smoke run.
# Relative-strength KOSPI JSON source smoke run.
# Three-session historical fallback smoke run.
# Relative-strength live KOSPI prevChangeRate parser smoke run.
# Multi-period relative-strength Yahoo batch smoke run.
# KOFIA big-money parser verification smoke run.
# Seven-day issue discovery smoke run.
# Autonomous issue/recovery end-to-end smoke run.
# Final recovery-state refresh smoke run.
# Hot-topic generic-term filter live verification.

on:
  workflow_dispatch:
    inputs:
      slot_at:
        description: "복구 실행에서 고정할 10분 슬롯 ISO 시각(선택)"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/연속연구와진화.yml"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: stock-autoresearch-observer
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Pin observation slot at workflow start
        env:
          REQUESTED_SLOT_AT: ${{ inputs.slot_at }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from datetime import datetime, timedelta, timezone

          KST = timezone(timedelta(hours=9))
          requested = (os.getenv("REQUESTED_SLOT_AT") or "").strip()
          now = datetime.now(KST)
          current_slot = now.replace(minute=(now.minute // 10) * 10, second=0, microsecond=0)
          if requested:
              parsed = datetime.fromisoformat(requested.replace("Z", "+00:00"))
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=KST)
              requested_kst = parsed.astimezone(KST)
              requested_slot = requested_kst.replace(
                  minute=(requested_kst.minute // 10) * 10,
                  second=0,
                  microsecond=0,
              )
              if requested_slot == current_slot:
                  slot = requested_slot
                  source = "dispatch_input"
              else:
                  # 오래 지연된 dispatch를 과거 슬롯의 실제 관측처럼 저장하지 않는다.
                  slot = current_slot
                  source = "dispatch_input_rebased"
          else:
              slot = current_slot
              source = "workflow_start"
          start_delay = max(0.0, (now - slot).total_seconds())
          print(f"SENSOR_SLOT_AT={slot.isoformat()}")
          print(f"SENSOR_SLOT_SOURCE={source}")
          print(f"SENSOR_SLOT_START_DELAY_SECONDS={start_delay:.3f}")
          PY

      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Fetch Toss provider snapshot
        id: fetch_toss
        continue-on-error: true
        env:
          TOSS_SNAPSHOT_URL: https://raw.githubusercontent.com/juhwan7/vibe-coding-playground/stock-autoresearch-toss-data/latest.json
        run: python scripts/토스스냅샷_가져오기.py

      - name: Summarize Toss provider state
        id: toss_summary
        continue-on-error: true
        run: |
          if [ -f data/providers/toss/latest.json ]; then
            python scripts/토스상태_요약.py
          fi

      - name: Collect public ten-minute market batch
        id: public_batch
        continue-on-error: true
        run: python -m autoresearch naver-batch-market --limit 100

      - name: Collect index-relative strength
        id: relative_strength
        continue-on-error: true
        run: python -m autoresearch relative-strength --limit 500

      - name: Collect broad market discovery
        id: discovery
        continue-on-error: true
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m autoresearch market-discovery-observe

      - name: Repair market runtime without AI
        id: market_sensor
        continue-on-error: true
        env:
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_SECRET_KEY: ${{ secrets.KIWOOM_SECRET_KEY }}
        run: python -m autoresearch market-intel --mode sensor

      - name: Repair risk and macro runtime without AI
        id: risk_sensor
        continue-on-error: true
        run: python -m autoresearch risk-intel --mode sensor

      - name: Refresh regression guard
        id: regression
        continue-on-error: true
        run: python -m autoresearch regression

      - name: Health watchdog after repair attempts
        id: health
        continue-on-error: true
        run: python -m autoresearch health

      - name: Collect official big-money market data
        id: big_money
        continue-on-error: true
        run: python scripts/거대자금_수집.py

      - name: Refresh recovery and Kanban status
        id: operations
        continue-on-error: true
        run: python scripts/운영상태_생성.py

      - name: Build dashboard data
        id: dashboard
        continue-on-error: true
        run: python scripts/대시보드_생성.py

      - name: Validate repository
        run: |
          set +e

          COMPILE_STATUS=ok
          python -m compileall -q src collector scripts || COMPILE_STATUS=failed

          PYTEST_STATUS=ok
          pytest -q || PYTEST_STATUS=failed

          DIFF_STATUS=ok
          git diff --check || DIFF_STATUS=failed

          VALIDATION_STATUS=ok
          if [ "$COMPILE_STATUS" != "ok" ] || [ "$PYTEST_STATUS" != "ok" ] || [ "$DIFF_STATUS" != "ok" ]; then
            VALIDATION_STATUS=failed
          fi

          echo "COMPILE_STATUS=$COMPILE_STATUS" >> "$GITHUB_ENV"
          echo "PYTEST_STATUS=$PYTEST_STATUS" >> "$GITHUB_ENV"
          echo "DIFF_STATUS=$DIFF_STATUS" >> "$GITHUB_ENV"
          echo "VALIDATION_STATUS=$VALIDATION_STATUS" >> "$GITHUB_ENV"

          echo "compile=$COMPILE_STATUS pytest=$PYTEST_STATUS diff=$DIFF_STATUS validation=$VALIDATION_STATUS"

      - name: Record 10-minute supervisor observation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOSS_FETCH_STATUS: ${{ steps.fetch_toss.outcome }}
          TOSS_SUMMARY_STATUS: ${{ steps.toss_summary.outcome }}
          HEALTH_STEP_STATUS: ${{ steps.health.outcome }}
          DASHBOARD_STEP_STATUS: ${{ steps.dashboard.outcome }}
          DISCOVERY_STEP_STATUS: ${{ steps.discovery.outcome }}
          PUBLIC_BATCH_STATUS: ${{ steps.public_batch.outcome }}
          MARKET_SENSOR_STATUS: ${{ steps.market_sensor.outcome }}
          RISK_SENSOR_STATUS: ${{ steps.risk_sensor.outcome }}
          REGRESSION_STEP_STATUS: ${{ steps.regression.outcome }}
        run: python -m autoresearch supervisor-observe

      - name: Commit observation data
        run: |
          git config user.name "stock-autoresearch[bot]"
          git config user.email "stock-autoresearch[bot]@users.noreply.github.com"

          git add data/supervisor
          if [ -d data/providers/toss ]; then git add data/providers/toss; fi
          if [ -d data/providers/naver_batch ]; then git add data/providers/naver_batch; fi
          if [ -d data/health ]; then git add data/health; fi
          if [ -d data/discovery ]; then git add data/discovery; fi
          if [ -d data/market ]; then git add data/market; fi
          if [ -d data/risk ]; then git add data/risk; fi
          if [ -d data/macro ]; then git add data/macro; fi
          if [ -d data/regression ]; then git add data/regression; fi
          if [ -d site ]; then git add site; fi

          # Recovery가 단독 소유하는 운영 상태판 파일은 센서 commit에서 제외한다.
          # 센서는 로컬 dashboard 검증에만 사용하고 main에는 Recovery가 기록한다.
          git restore --staged site/data/상태.json 2>/dev/null || true
          git restore             data/operations/status.json             docs/운영_칸반.md             README.md             site/data/상태.json             2>/dev/null || true

          if git diff --cached --quiet; then
            echo "이번 10분 관측에는 저장할 변화가 없습니다."
          else
            git commit -m "observe: record 10-minute supervisor checkpoint"

            # 다른 AI/사용자 작업이 같은 시각 main을 갱신하면 생성 데이터는
            # 줄 단위 병합보다 다음 10분 주기에 최신 입력으로 다시 만드는 편이 안전하다.
            # 오래된 관측을 억지로 재베이스해 충돌 파일을 저장하지 않는다.
            if ! git pull --rebase; then
              echo "main 동시 갱신으로 핵심 관측 commit이 충돌했습니다. observation 저장 실패를 숨기지 않고 workflow를 실패 처리합니다."
              git rebase --abort || true
              exit 1
            fi

            if ! git push; then
              echo "push 직전 main이 다시 갱신되어 핵심 observation 저장에 실패했습니다."
              exit 1
            fi
          fi

      - name: Keep 10-minute sensor chain alive
        if: always() && github.ref == 'refs/heads/main' && vars.SENSOR_SELF_CHAIN_DISABLED != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' > /tmp/next-sensor.env
          from datetime import datetime, timedelta, timezone

          KST = timezone(timedelta(hours=9))
          now = datetime.now(KST)
          current_slot = now.replace(minute=(now.minute // 10) * 10, second=0, microsecond=0)
          next_slot = current_slot + timedelta(minutes=10)
          target = next_slot + timedelta(seconds=20)
          wait_seconds = max(0, int((target - now).total_seconds()))
          print(f"NEXT_SLOT={next_slot.isoformat()}")
          print(f"WAIT_SECONDS={wait_seconds}")
          PY
          cat /tmp/next-sensor.env
          source /tmp/next-sensor.env

          if [ "$WAIT_SECONDS" -gt 0 ]; then
            sleep "$WAIT_SECONDS"
          fi

          fetch_latest_slot() {
            if ! gh api "repos/$GH_REPO/contents/data/supervisor/recent.json?ref=main" \
              --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d > /tmp/chain-recent.json 2>/dev/null; then
              echo ""
              return
            fi
            python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          try:
              payload = json.loads(Path("/tmp/chain-recent.json").read_text(encoding="utf-8"))
          except Exception:
              print("")
              raise SystemExit(0)

          slots = []
          for item in payload.get("observations") or []:
              if not isinstance(item, dict):
                  continue
              value = item.get("slot_at")
              if not value:
                  continue
              try:
                  slots.append(datetime.fromisoformat(str(value).replace("Z", "+00:00")))
              except ValueError:
                  continue
          print(max(slots).isoformat() if slots else "")
          PY
          }

          slot_is_ready() {
            python - "$1" "$2" <<'PY'
          import sys
          from datetime import datetime

          latest, expected = sys.argv[1:3]
          if not latest:
              raise SystemExit(1)
          try:
              latest_dt = datetime.fromisoformat(latest.replace("Z", "+00:00"))
              expected_dt = datetime.fromisoformat(expected.replace("Z", "+00:00"))
          except ValueError:
              raise SystemExit(1)
          raise SystemExit(0 if latest_dt >= expected_dt else 1)
          PY
          }

          LATEST_SLOT="$(fetch_latest_slot)"
          if slot_is_ready "$LATEST_SLOT" "$NEXT_SLOT"; then
            echo "다음 슬롯 $NEXT_SLOT 이 이미 저장되어 self-chain dispatch를 생략합니다."
            exit 0
          fi

          gh run list \
            --workflow "연속연구와진화.yml" \
            --repo "$GH_REPO" \
            --limit 20 \
            --json databaseId,status > /tmp/chain-runs.json

          ACTIVE_OTHER_RUNS=$(python - "$CURRENT_RUN_ID" <<'PY'
          import json
          import sys
          from pathlib import Path

          current = str(sys.argv[1])
          try:
              runs = json.loads(Path("/tmp/chain-runs.json").read_text(encoding="utf-8"))
          except Exception:
              print(0)
              raise SystemExit(0)

          count = 0
          for item in runs:
              if str(item.get("databaseId")) == current:
                  continue
              if item.get("status") in {"queued", "in_progress"}:
                  count += 1
          print(count)
          PY
          )

          if [ "${ACTIVE_OTHER_RUNS:-0}" -gt 0 ]; then
            echo "다음 슬롯을 담당할 센서가 이미 실행/대기 중이라 self-chain dispatch를 생략합니다."
            exit 0
          fi

          LATEST_SLOT="$(fetch_latest_slot)"
          if slot_is_ready "$LATEST_SLOT" "$NEXT_SLOT"; then
            echo "재확인 중 다음 슬롯이 저장되어 self-chain dispatch를 생략합니다."
            exit 0
          fi

          echo "GitHub schedule에 의존하지 않고 다음 슬롯 $NEXT_SLOT 센서를 self-chain으로 실행합니다."
          gh workflow run "연속연구와진화.yml" \
            --repo "$GH_REPO" \
            --ref main \
            -f slot_at="$NEXT_SLOT"

      - name: Surface validation failure
        if: env.VALIDATION_STATUS != 'ok'
        run: |
          echo "저장소 검증 실패가 감독 큐에 기록되었습니다."
          exit 1
