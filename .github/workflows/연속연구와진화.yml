name: 10분 연속 연구와 자기진화

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        required: true
        default: "live"
        type: choice
        options:
          - live
          - dry-run
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: stock-autoresearch-writer
  cancel-in-progress: false

jobs:
  continuous:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Tick 시작 커밋 저장
        run: echo "TICK_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Resolve mode
        env:
          REQUESTED_MODE: ${{ github.event.inputs.mode }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          MODE="$REQUESTED_MODE"
          if [ -z "$MODE" ]; then MODE="live"; fi
          if [ "$MODE" = "live" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY가 없어 live Continuous Loop를 실행할 수 없습니다."
            exit 1
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
      - name: Project evolution tick
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m autoresearch evolve --mode "$MODE"
      - name: Fetch Toss provider snapshot
        if: vars.TOSS_FIXED_IP_RUNNER_ENABLED != 'true'
        env:
          TOSS_SNAPSHOT_URL: ${{ secrets.TOSS_SNAPSHOT_URL }}
          TOSS_SNAPSHOT_TOKEN: ${{ secrets.TOSS_SNAPSHOT_TOKEN }}
        run: python scripts/토스스냅샷_가져오기.py

      - name: Summarize Toss provider state
        if: vars.TOSS_FIXED_IP_RUNNER_ENABLED != 'true'
        run: |
          if [ -f data/providers/toss/latest.json ]; then
            python scripts/토스상태_요약.py
          fi

      - name: Korea market tape tick
        if: vars.TOSS_FIXED_IP_RUNNER_ENABLED != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_SECRET_KEY: ${{ secrets.KIWOOM_SECRET_KEY }}
        run: python -m autoresearch market-intel --mode "$MODE"

      - name: Overnight risk tick
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m autoresearch risk-intel --mode "$MODE"

      - name: Market research tick
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m autoresearch run --mode "$MODE"

      - name: Health watchdog
        run: python -m autoresearch health

      - name: Regression guard
        run: python -m autoresearch regression

      - name: Build dashboard data
        run: python scripts/대시보드_생성.py
      - name: Validate final repository state
        run: |
          python -m compileall -q src collector scripts
          pytest -q
          git diff --check
      - name: Commit this tick
        if: env.MODE == 'live'
        run: |
          git config user.name "stock-autoresearch[bot]"
          git config user.email "stock-autoresearch[bot]@users.noreply.github.com"
          git add docs prompts site src tests data reports
          if git diff --cached --quiet; then
            echo "이번 Tick에는 저장할 변화가 없습니다."
          else
            git commit -m "auto: 10-minute research and evolution tick"
            git pull --rebase
            git push
          fi

      - name: GitHub Issue 변경 알림
        if: env.MODE == 'live'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/알림피드백.py notify \
            --issue 1 \
            --base-sha "$TICK_BASE_SHA"
