name: 텔레그램 알림 테스트

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 테스트 메시지 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token:
              raise SystemExit("TELEGRAM_BOT_TOKEN Secret이 없습니다.")

          if not chat_id:
              updates_req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/getUpdates"
              )
              with urllib.request.urlopen(updates_req, timeout=20) as response:
                  updates = json.loads(response.read().decode("utf-8"))

              candidates = []
              for update in updates.get("result", []):
                  message = (
                      update.get("message")
                      or update.get("edited_message")
                      or update.get("channel_post")
                      or {}
                  )
                  chat = message.get("chat") or {}
                  if chat.get("id") is not None:
                      candidates.append(chat)

              if not candidates:
                  raise SystemExit(
                      "TELEGRAM_CHAT_ID가 없습니다. Telegram에서 Bot에게 "
                      "/start 또는 아무 메시지를 먼저 보낸 뒤 다시 실행하세요."
                  )

              chat = candidates[-1]
              chat_id = str(chat["id"])
              print("발견한 Telegram Chat ID:", chat_id)
              print(
                  "이 값을 GitHub Actions Secret TELEGRAM_CHAT_ID로 등록한 뒤 "
                  "workflow를 다시 실행하세요."
              )
              raise SystemExit(0)

          payload = {
              "chat_id": chat_id,
              "text": (
                  "✅ Stock AutoResearch Telegram 연결 성공\n\n"
                  "앞으로 실제 AI 개선, 중요한 Health 경고, "
                  "Regression 이벤트가 발생하면 이 채팅으로 알립니다."
              ),
              "link_preview_options": {"is_disabled": True},
              "reply_markup": {
                  "inline_keyboard": [[
                      {
                          "text": "💬 바로 피드백",
                          "url": "https://github.com/juhwan7/stock-autoresearch/issues/1",
                      },
                      {
                          "text": "📊 대시보드",
                          "url": "https://juhwan7.github.io/stock-autoresearch/",
                      },
                  ]]
              },
          }
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              method="POST",
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.loads(response.read().decode("utf-8"))
          if not data.get("ok"):
              raise SystemExit("Telegram API가 ok=false를 반환했습니다.")
          print("Telegram 테스트 알림 전송 성공")
          PY
