name: 텔레그램 알림 테스트

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 테스트 메시지 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token:
              raise SystemExit("TELEGRAM_BOT_TOKEN Secret이 없습니다.")

          if not chat_id:
              me_req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/getMe"
              )
              with urllib.request.urlopen(me_req, timeout=20) as response:
                  me = json.loads(response.read().decode("utf-8"))
              username = ((me.get("result") or {}).get("username") or "확인불가")
              print("연결된 Telegram Bot:", "@" + username)

              candidates = []
              for attempt in range(6):
                  updates_req = urllib.request.Request(
                      f"https://api.telegram.org/bot{token}/getUpdates?timeout=5"
                  )
                  with urllib.request.urlopen(updates_req, timeout=10) as response:
                      updates = json.loads(response.read().decode("utf-8"))

                  for update in updates.get("result", []):
                      message = (
                          update.get("message")
                          or update.get("edited_message")
                          or update.get("channel_post")
                          or {}
                      )
                      chat = message.get("chat") or {}
                      if chat.get("id") is not None:
                          candidates.append(chat)

                  if candidates:
                      break
                  print(
                      f"Chat ID 대기 중 ({attempt + 1}/6). "
                      f"Telegram에서 @{username}에게 '테스트'라고 보내세요."
                  )
                  time.sleep(1)

              if not candidates:
                  raise SystemExit(
                      f"@{username} 대화에서 새 메시지를 찾지 못했습니다. "
                      "이 Bot 채팅에 '테스트'라고 한 번 보내고 다시 실행하세요."
                  )

              chat = candidates[-1]
              chat_id = str(chat["id"])
              print("발견한 Telegram Chat ID:", chat_id)
              print(
                  "TELEGRAM_CHAT_ID Secret이 없어 자동 발견한 Chat ID로 "
                  "이번 테스트 메시지를 바로 전송합니다."
              )

          payload = {
              "chat_id": chat_id,
              "text": (
                  "✅ Stock AutoResearch Telegram 연결 성공\n\n"
                  "앞으로 실제 AI 개선, 중요한 Health 경고, "
                  "Regression 이벤트가 발생하면 이 채팅으로 알립니다."
              ),
              "link_preview_options": {"is_disabled": True},
              "reply_markup": {
                  "inline_keyboard": [[
                      {
                          "text": "💬 바로 피드백",
                          "url": "https://github.com/juhwan7/stock-autoresearch/issues/1",
                      },
                      {
                          "text": "📊 대시보드",
                          "url": "https://juhwan7.github.io/stock-autoresearch/",
                      },
                  ]]
              },
          }
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              method="POST",
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.loads(response.read().decode("utf-8"))
          if not data.get("ok"):
              raise SystemExit("Telegram API가 ok=false를 반환했습니다.")
          print("Telegram 테스트 알림 전송 성공")
          PY
