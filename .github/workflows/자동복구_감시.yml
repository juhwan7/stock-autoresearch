name: 자동복구 감시

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/자동복구_감시.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: stock-autoresearch-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Refresh long-term memory
        continue-on-error: true
        run: python scripts/장기기억_갱신.py

      - name: Build recovery status
        run: python scripts/운영상태_생성.py

      - name: Check 10-minute sensor freshness
        id: recover
        shell: bash
        run: |
          python - <<'PY' > /tmp/recovery.env
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          STALE_AFTER_MINUTES = 25.0

          def parse(value):
              if not value:
                  return None
              try:
                  parsed = datetime.fromisoformat(str(value).replace("Z","+00:00"))
              except ValueError:
                  return None
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=timezone.utc)
              return parsed.astimezone(timezone.utc)

          def read_json(path):
              try:
                  value = json.loads(Path(path).read_text(encoding="utf-8"))
              except Exception:
                  return {}
              return value if isinstance(value, dict) else {}

          now = datetime.now(timezone.utc)
          discovery = read_json("data/discovery/latest.json")
          recent = read_json("data/supervisor/recent.json")
          observations = recent.get("observations") or []
          latest_observation = observations[-1] if observations and isinstance(observations[-1], dict) else {}

          discovery_at = parse(discovery.get("generated_at"))
          sensor_at = parse(latest_observation.get("slot_at") or latest_observation.get("observed_at"))
          discovery_age = 99999 if discovery_at is None else max(0, (now-discovery_at).total_seconds()/60)
          sensor_age = 99999 if sensor_at is None else max(0, (now-sensor_at).total_seconds()/60)

          should_recover = discovery_age > STALE_AFTER_MINUTES or sensor_age > STALE_AFTER_MINUTES
          print(f"DISCOVERY_AGE_MINUTES={discovery_age:.1f}")
          print(f"SENSOR_AGE_MINUTES={sensor_age:.1f}")
          print(f"RECOVER_SENSOR={'true' if should_recover else 'false'}")
          PY
          cat /tmp/recovery.env >> "$GITHUB_ENV"
          cat /tmp/recovery.env

      - name: Rebuild dashboard after recovery status
        run: python scripts/대시보드_생성.py

      - name: Validate recovery files
        run: |
          python -m py_compile scripts/운영상태_생성.py scripts/대시보드_생성.py scripts/장기기억_갱신.py
          python - <<'PY'
          import json
          from pathlib import Path
          ops=json.loads(Path("data/operations/status.json").read_text(encoding="utf-8"))
          page=json.loads(Path("site/data/상태.json").read_text(encoding="utf-8"))
          assert ops.get("generated_at")
          assert isinstance(ops.get("cards"), list)
          assert page.get("operations",{}).get("generated_at")
          print("recovery status verified", ops.get("status"))
          PY

      - name: Commit recovery status
        shell: bash
        run: |
          git config user.name "stock-autoresearch-recovery[bot]"
          git config user.email "stock-autoresearch-recovery[bot]@users.noreply.github.com"
          git add data/operations/status.json docs/운영_칸반.md README.md site/data/상태.json
          if [ -d memory ]; then git add memory; fi
          if git diff --cached --quiet; then
            echo "복구 상태 변화 없음"
            exit 0
          fi
          git commit -m "recovery: refresh watchdog and user-action board"
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "동시 변경으로 복구 상태 저장을 건너뜁니다. 다음 15분 주기에서 재생성합니다."
            exit 0
          fi
          git push origin HEAD:main || echo "다음 복구 주기에서 다시 저장합니다."

      - name: Dispatch stale 10-minute sensor after recovery commit
        if: env.RECOVER_SENSOR == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "10분 센서 또는 discovery가 25분 이상 stale입니다. recovery commit 이후 센서를 재실행합니다."
          gh workflow run "연속연구와진화.yml" --repo "$GH_REPO" || true
