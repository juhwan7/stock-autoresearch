name: 자동 주식 리서치

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        required: true
        default: "live"
        type: choice
        options:
          - live
          - dry-run

permissions:
  contents: write

concurrency:
  group: stock-autoresearch-writer
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Run research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REQUESTED_MODE: ${{ github.event.inputs.mode }}
        run: |
          MODE="$REQUESTED_MODE"
          if [ "$MODE" = "live" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is required for live mode."
            exit 1
          fi
          python -m autoresearch run --mode "$MODE"
      - name: Commit artifacts
        if: github.event.inputs.mode == 'live'
        run: |
          git config user.name "stock-autoresearch[bot]"
          git config user.email "stock-autoresearch[bot]@users.noreply.github.com"
          git add data/runs data/state reports
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "auto: manual research run"
          git push
