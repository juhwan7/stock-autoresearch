name: Continuous Research and Evolution

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        required: true
        default: "live"
        type: choice
        options:
          - live
          - dry-run
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-autoresearch-writer
  cancel-in-progress: false

jobs:
  continuous:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Resolve mode
        env:
          REQUESTED_MODE: ${{ github.event.inputs.mode }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          MODE="$REQUESTED_MODE"
          if [ -z "$MODE" ]; then MODE="live"; fi
          if [ "$MODE" = "live" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY가 없어 live Continuous Loop를 실행할 수 없습니다."
            exit 1
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
      - name: Project evolution tick
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m autoresearch evolve --mode "$MODE"
      - name: Market research tick
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m autoresearch run --mode "$MODE"
      - name: Build dashboard data
        run: python scripts/build_site.py
      - name: Validate final repository state
        run: |
          python -m compileall -q src
          pytest -q
          git diff --check
      - name: Commit this tick
        run: |
          git config user.name "stock-autoresearch[bot]"
          git config user.email "stock-autoresearch[bot]@users.noreply.github.com"
          git add docs prompts site src tests data reports
          if git diff --cached --quiet; then
            echo "이번 Tick에는 저장할 변화가 없습니다."
          else
            git commit -m "auto: 10-minute research and evolution tick"
            git pull --rebase
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: continuous
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
