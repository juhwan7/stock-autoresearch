name: 10분 센서 보조 heartbeat

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/10분센서_보조복구.yml"
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: stock-autoresearch-sensor-heartbeat
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve expected 10-minute slot
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, timedelta, timezone

          KST = timezone(timedelta(hours=9))
          now = datetime.now(KST)
          slot = now.replace(minute=(now.minute // 10) * 10, second=0, microsecond=0)
          print(f"EXPECTED_SLOT={slot.isoformat()}")
          PY

      - name: Recover only when the current slot is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          fetch_latest_slot() {
            if ! gh api "repos/$GH_REPO/contents/data/supervisor/recent.json?ref=main"               --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d > /tmp/heartbeat-recent.json 2>/dev/null; then
              echo ""
              return
            fi
            python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          try:
              payload = json.loads(Path("/tmp/heartbeat-recent.json").read_text(encoding="utf-8"))
          except Exception:
              print("")
              raise SystemExit(0)

          slots = []
          for item in payload.get("observations") or []:
              if not isinstance(item, dict):
                  continue
              value = item.get("slot_at")
              if not value:
                  continue
              try:
                  slots.append(datetime.fromisoformat(str(value).replace("Z", "+00:00")))
              except ValueError:
                  continue
          print(max(slots).isoformat() if slots else "")
          PY
          }

          slot_is_ready() {
            python - "$1" "$2" <<'PY'
          import sys
          from datetime import datetime

          latest, expected = sys.argv[1:3]
          if not latest:
              raise SystemExit(1)
          try:
              latest_dt = datetime.fromisoformat(latest.replace("Z", "+00:00"))
              expected_dt = datetime.fromisoformat(expected.replace("Z", "+00:00"))
          except ValueError:
              raise SystemExit(1)
          raise SystemExit(0 if latest_dt >= expected_dt else 1)
          PY
          }

          LATEST_SLOT="$(fetch_latest_slot)"
          echo "expected=$EXPECTED_SLOT latest=${LATEST_SLOT:-missing}"

          if slot_is_ready "$LATEST_SLOT" "$EXPECTED_SLOT"; then
            echo "현재 10분 슬롯이 이미 canonical recent.json에 저장되어 있습니다."
            exit 0
          fi

          ACTIVE_SENSOR_RUNS=$(gh run list             --workflow "연속연구와진화.yml"             --repo "$GH_REPO"             --limit 20             --json status             --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length' 2>/dev/null || echo 0)

          if [ "${ACTIVE_SENSOR_RUNS:-0}" -gt 0 ]; then
            echo "이미 실행 중/대기 중인 센서가 ${ACTIVE_SENSOR_RUNS}개 있어 heartbeat dispatch를 생략합니다."
            exit 0
          fi

          # active-run 조회 직후 센서가 저장을 끝냈을 수 있으므로 한 번 더 canonical 상태를 확인한다.
          LATEST_SLOT="$(fetch_latest_slot)"
          if slot_is_ready "$LATEST_SLOT" "$EXPECTED_SLOT"; then
            echo "재확인 중 현재 슬롯이 저장되어 dispatch를 생략합니다."
            exit 0
          fi

          echo "현재 슬롯 $EXPECTED_SLOT 이 누락되어 해당 슬롯을 고정한 센서를 재실행합니다."
          gh workflow run "연속연구와진화.yml"             --repo "$GH_REPO"             --ref main             -f slot_at="$EXPECTED_SLOT"
