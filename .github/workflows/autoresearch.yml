name: Autonomous Stock Research

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "live"
        type: choice
        options:
          - live
          - dry-run
  schedule:
    # 21:30 UTC Sun-Thu = 06:30 KST Mon-Fri
    - cron: "30 21 * * 0-4"

permissions:
  contents: write

concurrency:
  group: stock-autoresearch-main
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run autonomous research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
          REQUESTED_MODE: ${{ github.event.inputs.mode }}
        run: |
          MODE="$REQUESTED_MODE"
          if [ -z "$MODE" ]; then
            MODE="live"
          fi
          if [ "$MODE" = "live" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is required for live mode."
            exit 1
          fi
          python -m autoresearch run --mode "$MODE"

      - name: Commit research artifacts
        run: |
          git config user.name "stock-autoresearch[bot]"
          git config user.email "stock-autoresearch[bot]@users.noreply.github.com"
          git add data/runs data/state reports
          if git diff --cached --quiet; then
            echo "No research artifacts changed."
            exit 0
          fi
          git commit -m "auto: autonomous research run"
          git push
