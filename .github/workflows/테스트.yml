name: 프로젝트 검증

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/supervisor/**"
      - "data/providers/**"
      - "data/discovery/**"
      - "data/health/**"
      - "data/regression/history/**"
      - "data/risk/*.json"
      - "data/macro/*.json"
      - "data/market/runtime.json"
      - "site/data/상태.json"
      - "reports/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile runtime scripts
        run: python -m compileall -q src collector scripts
      - name: Unit tests
        run: pytest -q
      - name: Dry-run market pipeline
        run: python -m autoresearch run --mode dry-run
      - name: Dry-run evolution pipeline
        run: python -m autoresearch evolve --mode dry-run
      - name: Dry-run Korea market tape
        run: python -m autoresearch market-intel --mode dry-run
      - name: Dry-run Overnight Risk
        run: python -m autoresearch risk-intel --mode dry-run
      - name: Health watchdog
        run: python -m autoresearch health
      - name: Regression guard
        run: python -m autoresearch regression
      - name: Build dashboard
        run: python scripts/대시보드_생성.py
      - name: Diff check
        run: git diff --check
