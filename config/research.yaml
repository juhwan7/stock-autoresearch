root_topic: stocks

markets:
  - KRX
  - NYSE
  - NASDAQ

languages:
  research: ko
  sources: any

window_hours: 12

limits:
  max_candidates: 8
  max_topics: 1
  max_research_loops: 1
  minimum_candidate_score: 62

models:
  scanner:
    name: gpt-5.6-luna
    reasoning_effort: low
    web_search_context: low
  researcher:
    name: gpt-5.6-terra
    reasoning_effort: high
    web_search_context: high
  critic:
    name: gpt-5.6-terra
    reasoning_effort: high
    web_search_context: medium
  chief:
    name: gpt-5.6-terra
    reasoning_effort: medium
    web_search_context: low

output:
  runs_dir: data/runs
  state_dir: data/state
  reports_dir: reports
