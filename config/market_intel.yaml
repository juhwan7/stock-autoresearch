enabled: true
market: KRX
timezone: Asia/Seoul

universe:
  turnover_rank_limit: 50
  detail_minute_limit: 20
  recent_listing_extra_limit: 10
  group_member_extra_limit: 10
  recent_listing_calendar_days: 90

minute_analysis:
  baseline_window: 20
  burst_ratio: 2.5
  min_burst_amount_krw: 500000000
  absolute_amount_thresholds_krw:
    - 500000000
    - 1000000000
    - 2000000000
    - 5000000000
  strong_burst_ratio: 4.0
  close_watch_start: "14:30"
  continuous_end: "15:20"

coflow:
  minimum_members: 3
  window_minutes: 3
  minute_return_threshold_pct: 0.15
  burst_ratio_threshold: 1.8

statistics:
  min_sample_size: 20
  percentiles: [0.25, 0.5, 0.75]
  close_bet_forward_days: [1]
  pullback_forward_days: [1, 3, 5]

data:
  raw_dir: data/market/raw
  snapshot_dir: data/market/snapshots
  stats_dir: data/market/stats
  latest_file: data/market/latest.json
  runtime_file: data/market/runtime.json
  dry_run_file: data/market/dry_run_latest.json

models:
  regime:
    name: gpt-5.6-terra
    reasoning_effort: medium
    web_search_context: low


pullback_research:
  enabled: true
  cohort_version: "v1"
  run_after: "15:30"
  run_before: "18:00"
  universe_limit: 20
  min_impulse_return_pct: 5.0
  min_impulse_amount_krw: 100000000000
  min_impulse_amount_ratio: 2.0
  impulse_lookback_days: 25
  min_drawdown_pct: 5.0
  max_drawdown_pct: 35.0
  min_amount_decay_pct: 30.0
  max_pullback_days: 20
  event_cooldown_calendar_days: 7
  note: "초기 연구 코호트 조건이며 매수 신호가 아님. 표본이 쌓이면 통계로 재평가한다."
