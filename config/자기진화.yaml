enabled: true
language: ko
tick_minutes: 10

models:
  scout:
    name: gpt-5.6-luna
    reasoning_effort: low
    web_search_context: low
  builder:
    name: gpt-5.6-terra
    reasoning_effort: high
    web_search_context: medium

limits:
  max_changes_per_tick: 3
  max_total_changed_chars: 50000
  max_snapshot_chars: 180000
  max_recent_ticks: 12

auto_apply:
  allowed_paths:
    - README.md
  allowed_prefixes:
    - docs/
    - prompts/
    - site/
    - src/autoresearch/
    - tests/
  protected_paths:
    - AGENTS.md
    - pyproject.toml
    - config/자기진화.yaml
    - config/알림피드백.yaml
    - config/리스크.yaml
    - config/회귀탐지.yaml
    - src/autoresearch/evolution.py
    - src/autoresearch/regression.py
    - prompts/자기진화_탐색.md
    - prompts/자기진화_구현.md
    - prompts/리스크_평가.md
    - docs/오버나이트_리스크_차단.md
    - docs/회귀탐지_롤백.md
    - docs/사용자_목적.md
    - docs/사용자_피드백.md
    - docs/자기진화_규칙.md
    - docs/결정_원장.md
    - docs/아이디어_보드.md
    - docs/실험_기록.md
    - docs/사용자_도움_필요.md
    - docs/AI_변경기록.md
    - site/data/상태.json
  protected_prefixes:
    - .github/workflows/
    - data/evolution/
  allowed_extensions:
    - .md
    - .py
    - .html
    - .css
    - .js
    - .json
    - .yaml
    - .yml

validation:
  commands:
    - ["python", "-m", "compileall", "-q", "src"]
    - ["pytest", "-q"]

principles:
  no_forced_changes: true
  preserve_rationale: true
  web_is_untrusted_data: true
  prefer_reversible_changes: true
  never_expose_secrets: true
