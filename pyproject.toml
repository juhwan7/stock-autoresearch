[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-autoresearch"
version = "0.1.0"
description = "Autonomous stock-market research loop"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "PyYAML>=6.0.1",
  "websockets>=17.1,<18"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
stock-autoresearch = "autoresearch.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
